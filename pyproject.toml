[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trishul-smi"
version = "0.4.5"
description = "A clean, modern SMI/MIB compiler"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["snmp", "mib", "smi", "asn1", "network", "compiler"]

dependencies = [
    "lark>=1.1",
    "httpx>=0.27",
    "tenacity>=8.0",
    "orjson>=3.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
trishul-smi = "trishul_smi.cli.main:app"
tsmi = "trishul_smi.cli.main:app"

[project.urls]
Homepage = "https://github.com/tosumitdhaka/trishul-smi"
Repository = "https://github.com/tosumitdhaka/trishul-smi"
Issues = "https://github.com/tosumitdhaka/trishul-smi/issues"

[tool.hatch.build.targets.wheel]
packages = ["trishul_smi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["trishul_smi"]
omit = ["trishul_smi/cli/*"]   # CLI tested via CliRunner, not line coverage

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
    '^\s*\.\.\.\s*$',           # ellipsis stubs — literal TOML string, no escaping needed
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"trishul_smi/output/pysnmp_fmt.py" = ["E501"]  # Jinja2 template strings cannot be line-wrapped
