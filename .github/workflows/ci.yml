name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't
# queue behind a slow earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------ #
  # Lint (ruff check + ruff format)
  # Fast gate — runs on a single Python version; no package install needed.
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check trishul_smi tests

      - name: ruff format --check
        run: ruff format --check trishul_smi tests

  # ------------------------------------------------------------------ #
  # Type-check (mypy strict)
  # ------------------------------------------------------------------ #
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy trishul_smi

  # ------------------------------------------------------------------ #
  # Tests — matrix across all supported Python versions
  # ------------------------------------------------------------------ #
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint          # don’t burn matrix slots on known-bad code
    strategy:
      fail-fast: false   # report failures on all versions, not just the first
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: pytest
        run: |
          pytest \
            --tb=short \
            --cov=trishul_smi \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            -q

      # Upload coverage XML so the 3.12 run can post to a coverage service
      # (e.g. Codecov) without duplicating uploads from every matrix leg.
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
