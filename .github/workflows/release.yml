name: Release

# Triggers on any tag matching vX.Y.Z (or vX.Y.Z-rc.N etc.)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Least-privilege permissions; id-token is required for OIDC trusted publishing.
permissions:
  contents: write   # needed to create a GitHub Release
  id-token: write   # needed for PyPI trusted publishing (OIDC)

jobs:

  # ------------------------------------------------------------------ #
  # Run the full test suite before touching PyPI
  # ------------------------------------------------------------------ #
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  # ------------------------------------------------------------------ #
  # Build sdist + wheel
  # ------------------------------------------------------------------ #
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Verify dist contents
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ------------------------------------------------------------------ #
  # Publish to PyPI via OIDC trusted publishing (no API token needed).
  # Requires a PyPI "trusted publisher" configured for this repo +
  # environment name "pypi".
  # Docs: https://docs.pypi.org/trusted-publishers/
  # ------------------------------------------------------------------ #
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed — OIDC trusted publishing handles auth.
        # To publish to TestPyPI first, uncomment:
        # with:
        #   repository-url: https://test.pypi.org/legacy/

  # ------------------------------------------------------------------ #
  # Create a GitHub Release with auto-generated release notes.
  # ------------------------------------------------------------------ #
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # To use CHANGELOG.md instead of auto-generated notes:
          # body_path: CHANGELOG.md
